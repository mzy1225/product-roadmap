<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产品 Roadmap 可视化</title>
  <style>
    :root {
      --bg: #f5f6f2;
      --panel: #ffffff;
      --ink: #1e2320;
      --muted: #68716b;
      --line: #dce1d8;
      --soft: #eef1eb;
      --accent: #0f766e;
      --accent-2: #bf6f2e;
      --danger: #b93b46;
      --shadow: 0 18px 46px rgba(32, 38, 34, .14);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 284px 1fr;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: #fbfcf8;
    }

    main {
      min-width: 0;
      padding: 24px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .subhead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .view-toggle {
      display: inline-grid;
      grid-template-columns: repeat(6, minmax(64px, 1fr));
      gap: 3px;
      min-height: 40px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #eef1eb;
    }

    .view-toggle button {
      min-height: 32px;
      border: 0;
      background: transparent;
      white-space: nowrap;
    }

    .view-toggle button.active {
      background: var(--panel);
      box-shadow: 0 1px 4px rgba(32, 38, 34, .08);
    }

    .import-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.04);
      border: 1px solid rgba(0,0,0,.06);
      white-space: nowrap;
    }
    .sync-status::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: #9aa3a0;
    }
    .sync-status[data-state="synced"]::before { background: #16a34a; }
    .sync-status[data-state="pending"]::before { background: #f59e0b; animation: syncPulse 1s ease-in-out infinite; }
    .sync-status[data-state="syncing"]::before { background: #f59e0b; animation: syncPulse .8s ease-in-out infinite; }
    .sync-status[data-state="error"]::before { background: #dc2626; }
    .sync-status[data-state="unauthorized"]::before { background: #dc2626; }
    .sync-status[data-state="local"]::before { background: #6b7280; }
    .sync-status[data-state="loading"]::before { background: #3b82f6; animation: syncPulse 1s ease-in-out infinite; }
    @keyframes syncPulse {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }
    /* viewer 模式下，如果 Worker 不可用也没必要刷红，柔和一点 */
    body.role-viewer .sync-status[data-state="error"]::before { background: #9aa3a0; }

    .file-input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .search {
      width: min(420px, 100%);
      position: relative;
    }

    .search input {
      width: 100%;
      min-height: 40px;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      font-size: 14px;
      outline: none;
    }

    .search::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 13px;
      width: 13px;
      height: 13px;
      border: 2px solid #7a837d;
      border-radius: 50%;
    }

    .search::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 26px;
      width: 8px;
      height: 2px;
      background: #7a837d;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .btn-row, .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button, .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .secondary-btn {
      background: #eef1eb;
    }

    button { padding: 7px 11px; }

    button.active, .chip.active {
      border-color: var(--accent);
      background: #e0f1ee;
      color: #064d47;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .section-title {
      margin: 22px 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .legend {
      display: grid;
      gap: 9px;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .tier-badge {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #fff;
      font-weight: 850;
    }

    .legend-item strong { display: block; font-size: 13px; }
    .legend-item span { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(116px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .stat .value { font-size: 24px; font-weight: 850; }
    .stat .label { color: var(--muted); font-size: 12px; }

    .roadmap-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .roadmap {
      min-width: 1100px;
      display: grid;
      grid-template-columns: 170px repeat(4, minmax(220px, 1fr));
    }

    .roadmap.timeline-roadmap {
      min-width: 1240px;
    }

    .cell, .head-cell, .row-head {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .head-cell {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 72px;
      padding: 14px;
      background: #fbfcf8;
    }

    .corner {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #fbfcf8;
    }

    .head-cell strong { display: block; font-size: 24px; line-height: 1; }
    .head-cell span { color: var(--muted); font-size: 12px; }

    .row-head {
      position: sticky;
      left: 0;
      z-index: 1;
      min-height: 220px;
      padding: 14px 12px;
      background: #fbfcf8;
      text-transform: uppercase;
      font-weight: 850;
      letter-spacing: .04em;
      writing-mode: horizontal-tb;
    }

    .row-head small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      text-transform: none;
      letter-spacing: 0;
    }

    .cell {
      min-height: 220px;
      padding: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(245,246,242,.55));
    }

    .timeline-roadmap .cell {
      min-height: 190px;
    }

    .timeline-roadmap .row-head {
      min-height: 190px;
    }

    .timeline-roadmap .head-cell strong {
      font-size: 19px;
    }

    .lane {
      display: grid;
      gap: 9px;
    }

    .product-card {
      position: relative;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      min-height: 108px;
      padding: 9px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-right: 0;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 7px 20px rgba(34, 38, 34, .06);
      cursor: default;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: rgba(15, 118, 110, .34);
    }

    .status-edge {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      background: var(--status-stripe, #d5ddd7);
    }

    .product-card img {
      width: 72px;
      height: 86px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--soft);
    }

    .product-media {
      display: grid;
      align-content: start;
      gap: 6px;
      min-width: 0;
    }

    .media-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }

    .media-meta .tag {
      min-height: 19px;
      padding: 2px 5px;
      font-size: 10px;
      line-height: 1.2;
    }

    .product-card h3 {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .spu {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .card-meta {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .card-meta .meta-line {
      margin-top: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 6px;
      border-radius: 6px;
      background: var(--soft);
      color: #3f4842;
      font-size: 11px;
      font-weight: 750;
    }

    .channel-tag {
      border: 1px solid color-mix(in srgb, var(--channel-color) 40%, transparent);
      background: color-mix(in srgb, var(--channel-color) 14%, white);
      color: color-mix(in srgb, var(--channel-color) 68%, black);
    }

    .quarter {
      background: #f7eadf;
      color: #844511;
    }

    .competitor-tag {
      background: #f1e9f7;
      color: #5f3481;
    }

    .map-tag {
      background: #e6f2ee;
      color: #09564f;
      white-space: nowrap;
    }

    .variant-tag {
      background: #edf0f7;
      color: #37466f;
    }

    .sku-configs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .sku-config-tag {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 21px;
      padding: 3px 6px;
      border: 1px solid #dce2ee;
      border-radius: 6px;
      background: #f7f8fc;
      color: #37466f;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.25;
    }

    .empty {
      height: 100%;
      min-height: 110px;
      display: grid;
      place-items: center;
      color: #9ba49d;
      font-size: 12px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.48);
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      width: 390px;
      max-width: calc(100vw - 24px);
      padding: 14px;
      border: 1px solid rgba(30, 35, 32, .14);
      border-radius: var(--radius);
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .12s ease, transform .12s ease;
    }

    .tooltip.show { opacity: 1; transform: translateY(0); }
    .tooltip h2 { margin: 0 0 4px; font-size: 16px; }
    .tooltip .spu { margin-bottom: 10px; }
    .detail { display: grid; gap: 8px; }
    .detail-row { display: grid; grid-template-columns: 68px 1fr; gap: 10px; font-size: 12px; line-height: 1.45; }
    .detail-row b { color: var(--muted); }
    .detail-row > span { min-width: 0; }
    .hover-sku-configs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 0;
    }
    .competitor-list { display: grid; gap: 7px; }
    .competitor-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: start;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #faf8fc;
    }
    .competitor-item img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 5px;
      background: var(--soft);
    }
    .competitor-copy { display: grid; gap: 2px; min-width: 0; }
    .competitor-item strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .competitor-item span { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .variant-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .variant-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: start;
      min-width: 0;
      padding: 8px;
      border: 1px solid #dce2ee;
      border-radius: 7px;
      background: #f7f8fc;
    }
    .variant-item img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 5px;
      background: var(--soft);
    }
    .variant-item strong,
    .variant-item span {
      display: block;
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }
    .variant-copy { display: grid; gap: 3px; min-width: 0; }
    .variant-item strong { color: #26304c; font-size: 12px; }
    .variant-item span { color: #5f6b86; font-size: 11px; line-height: 1.35; }
    .variant-item b { color: #37466f; font-weight: 850; }
    .sku-empty {
      padding: 8px;
      border: 1px dashed #cbd3e4;
      border-radius: 7px;
      background: #fbfcff;
      color: #6a7286;
      font-size: 12px;
      line-height: 1.45;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(30, 35, 32, .22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
    }

    .drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 31;
      width: min(520px, 100vw);
      height: 100vh;
      padding: 18px;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: #fbfcf8;
      box-shadow: -18px 0 46px rgba(32, 38, 34, .16);
      transform: translateX(102%);
      transition: transform .18s ease;
    }

    .drawer.show { transform: translateX(0); }

    .drawer-head {
      position: sticky;
      top: -18px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 248, .96);
      backdrop-filter: blur(8px);
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .icon-btn {
      width: 34px;
      min-height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .drawer-hero {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 14px;
      align-items: start;
      margin-bottom: 14px;
    }

    .drawer-hero img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }

    .drawer .detail {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .drawer .detail-row {
      grid-template-columns: 82px 1fr;
      font-size: 13px;
    }

    .hidden { display: none !important; }

    /* —— 健康度色块 —— */
    .health-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6c8a78;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08);
      vertical-align: middle;
    }
    .health-dot.health-green  { background: #1e9c6b; }
    .health-dot.health-yellow { background: #d99b22; }
    .health-dot.health-red    { background: #c2353f; }
    .health-dot.health-na     { background: #b6bbb4; }

    .card-health {
      position: absolute;
      top: 8px;
      left: -2px;
      z-index: 2;
    }

    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 11px;
      font-weight: 750;
      color: #2d3530;
    }
    .health-pill .health-dot { box-shadow: none; width: 8px; height: 8px; }

    .owner-tag {
      background: #ecefe9;
      color: #2d3530;
    }
    .decision-tag {
      background: #fdecec;
      color: #8a242c;
      border: 1px dashed #d18289;
    }

    /* —— Executive 视图 —— */
    .exec-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1.3fr) 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 1200px) {
      .exec-grid { grid-template-columns: 1fr; }
    }
    .exec-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 7px 20px rgba(34,38,34,.04);
    }
    .exec-card h2 {
      margin: 0 0 4px;
      font-size: 14px;
      letter-spacing: 0;
    }
    .exec-card .exec-sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .campaign-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: #fbfcf8;
    }
    .campaign-row.health-green  { border-left-color: #1e9c6b; }
    .campaign-row.health-yellow { border-left-color: #d99b22; background: #fdf7eb; }
    .campaign-row.health-red    { border-left-color: #c2353f; background: #fbeeef; }
    .campaign-row strong { display: block; font-size: 13px; }
    .campaign-row .campaign-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .campaign-row .campaign-counts {
      display: flex;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
    }
    .campaign-row .count-chip {
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef1eb;
      color: #2d3530;
    }
    .campaign-row .count-chip.red   { background: #fbe2e4; color: #8a242c; }
    .campaign-row .count-chip.yellow{ background: #fbecd1; color: #6a4912; }
    .campaign-row .count-chip.green { background: #d9f1e5; color: #0c4d35; }

    .exec-item {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      padding: 9px 10px;
      margin-bottom: 7px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
      cursor: pointer;
    }
    .exec-item:hover { border-color: rgba(15,118,110,.34); }
    .exec-item strong { display: block; font-size: 12px; }
    .exec-item span { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .exec-empty {
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* —— 档位 × 渠道 空缺矩阵 —— */
    .gap-matrix {
      display: grid;
      gap: 0;
    }
    .gap-cell {
      min-height: 84px;
      padding: 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .gap-cell.head {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fbfcf8;
      font-weight: 850;
      min-height: 56px;
    }
    .gap-cell.head strong { font-size: 16px; }
    .gap-cell.head span { color: var(--muted); font-size: 11px; font-weight: 650; }
    .gap-cell .gap-count {
      font-size: 22px;
      font-weight: 850;
      line-height: 1;
    }
    .gap-cell .gap-spus {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .gap-cell .gap-spu {
      padding: 2px 6px;
      border-radius: 6px;
      background: #eef1eb;
      color: #2d3530;
      font-size: 11px;
      font-weight: 700;
    }
    .gap-cell.empty-cell {
      background: repeating-linear-gradient(135deg, #fff, #fff 8px, #fbe2e4 8px, #fbe2e4 16px);
      color: #8a242c;
      font-size: 12px;
      align-items: center;
      justify-content: center;
      display: flex;
    }
    .gap-cell.thin-cell {
      background: #fef6e8;
      color: #6a4912;
    }
    .gap-cell.row-head {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fbfcf8;
      font-weight: 850;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* —— Drawer 内联编辑 —— */
    .editable {
      cursor: text;
      border-bottom: 1px dashed transparent;
      padding: 1px 3px;
      border-radius: 4px;
      transition: background .12s ease, border-color .12s ease;
    }
    .editable:hover {
      background: rgba(15,118,110,.06);
      border-bottom-color: rgba(15,118,110,.4);
    }
    .editable[contenteditable="true"],
    .editable.is-editing {
      background: #fffdf2;
      border: 1px solid rgba(15,118,110,.5);
      border-radius: 4px;
      outline: none;
      box-shadow: 0 0 0 3px rgba(15,118,110,.08);
    }
    .editable.is-empty:not(.is-editing) {
      color: #aab1a8;
      font-style: italic;
    }
    .editable-select {
      padding: 3px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font: inherit;
      color: inherit;
    }
    .drawer-edit-hint {
      margin: 10px 0 14px;
      padding: 10px 12px;
      border: 1px solid #cfe4df;
      border-radius: var(--radius);
      background: #eaf6f2;
      color: #064d47;
      font-size: 12px;
      line-height: 1.45;
    }

    /* —— Toast —— */
    .toast-host {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 11px 14px;
      min-width: 260px;
      max-width: 360px;
      border: 1px solid rgba(30, 35, 32, .14);
      border-radius: var(--radius);
      background: rgba(30, 35, 32, .92);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: var(--shadow);
      pointer-events: auto;
      transform: translateY(10px);
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast button {
      margin-left: 8px;
      padding: 3px 9px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    /* —— 待评审 / Last updated —— */
    .stale-tag {
      background: #f4e8d7;
      color: #6a4912;
      border: 1px dashed #d8b774;
    }
    .updated-meta {
      color: var(--muted);
      font-size: 11px;
    }

    /* —— SKU notes 多行 —— */
    .editable.is-multiline {
      display: block;
      min-height: 28px;
      padding: 6px 8px;
      border: 1px dashed transparent;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .editable.is-multiline:hover {
      border-color: rgba(15,118,110,.4);
      background: rgba(15,118,110,.04);
    }
    .editable.is-multiline.is-editing {
      border: 1px solid rgba(15,118,110,.5);
      background: #fffdf2;
    }
    .variant-notes {
      grid-column: 1 / -1;
      margin-top: 4px;
    }
    .variant-notes b { color: var(--muted); font-size: 11px; }

    /* —— 依赖关系视图 —— */
    .deps-wrap { padding: 14px; display: grid; gap: 12px; }
    .platform-block {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .platform-block h2 {
      margin: 0 0 4px;
      font-size: 14px;
    }
    .platform-block .platform-meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .platform-spus {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dep-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fbfcf8;
      font-size: 12px;
      cursor: pointer;
    }
    .dep-chip:hover {
      border-color: rgba(15,118,110,.4);
      background: #f0f5f3;
    }
    .dep-chip .health-dot { width: 8px; height: 8px; box-shadow: none; }
    .dep-edge {
      margin-top: 8px;
      padding: 7px 10px;
      border-left: 3px solid var(--accent-2);
      background: #fdf4ec;
      font-size: 12px;
      color: #6a4912;
      border-radius: 0 6px 6px 0;
    }
    .dep-edge code {
      padding: 1px 5px;
      background: #fff;
      border: 1px solid #e5d2b3;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      cursor: pointer;
    }
    .dep-edge code:hover { background: #fef4e6; }

    /* —— 版本对比 / Diff —— */
    .diff-wrap { padding: 14px; }
    .diff-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .diff-head strong { font-size: 14px; }
    .diff-head .diff-empty {
      color: var(--muted);
      font-size: 12px;
    }
    .diff-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .diff-summary .pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }
    .diff-summary .pill.added    { background: #d9f1e5; color: #0c4d35; }
    .diff-summary .pill.removed  { background: #fbe2e4; color: #8a242c; }
    .diff-summary .pill.modified { background: #fbecd1; color: #6a4912; }
    .diff-section {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .diff-section h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      background: #fbfcf8;
      border-bottom: 1px solid var(--line);
    }
    .diff-section h2.added    { color: #0c4d35; border-left: 4px solid #1e9c6b; }
    .diff-section h2.removed  { color: #8a242c; border-left: 4px solid #c2353f; }
    .diff-section h2.modified { color: #6a4912; border-left: 4px solid #d99b22; }
    .diff-list { padding: 12px 14px; display: grid; gap: 10px; }
    .diff-item {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
      font-size: 12px;
      line-height: 1.5;
    }
    .diff-item strong { display: block; font-size: 13px; margin-bottom: 4px; cursor: pointer; }
    .diff-changes { display: grid; gap: 3px; }
    .diff-change {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 8px;
    }
    .diff-change b { color: var(--muted); font-weight: 700; }
    .diff-change .from {
      text-decoration: line-through;
      color: #8a242c;
      background: #fbe2e4;
      padding: 0 4px;
      border-radius: 3px;
    }
    .diff-change .arrow { color: var(--muted); margin: 0 6px; }
    .diff-change .to {
      color: #0c4d35;
      background: #d9f1e5;
      padding: 0 4px;
      border-radius: 3px;
    }

    /* —— 角色徽标 / 登录模态 —— */
    .role-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .role-bar .role-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eef1eb;
      font-size: 15px;
    }
    .role-bar .role-icon.admin { background: #d9f1e5; color: #0c4d35; }
    .role-bar .role-icon.viewer { background: #eef1eb; color: #4a544c; }
    .role-bar .role-body { flex: 1; min-width: 0; }
    .role-bar strong { display: block; font-size: 12px; }
    .role-bar small { color: var(--muted); font-size: 11px; }
    .role-bar button {
      min-height: 28px;
      padding: 4px 9px;
      font-size: 11px;
    }

    .auth-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background: rgba(30, 35, 32, .35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease;
    }
    .auth-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .auth-card {
      width: min(360px, calc(100vw - 32px));
      padding: 22px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      transform: translateY(10px);
      transition: transform .14s ease;
    }
    .auth-backdrop.show .auth-card { transform: translateY(0); }
    .auth-card h2 { margin: 0 0 4px; font-size: 16px; }
    .auth-card .auth-sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .auth-card label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .auth-card input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .auth-card input:focus { border-color: var(--accent); }
    .auth-error {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fbeeef;
      color: #8a242c;
      font-size: 12px;
      display: none;
    }
    .auth-error.show { display: block; }
    .auth-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .auth-actions .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* viewer 模式下：drawer 编辑提示 + 保存基准等管理操作隐藏 */
    body.role-viewer .admin-only { display: none !important; }
    body.role-viewer .editable {
      cursor: default;
      border-bottom-color: transparent !important;
    }
    body.role-viewer .editable:hover {
      background: transparent !important;
      border-bottom-color: transparent !important;
    }

    /* —— PNG 导出态 —— */
    .export-snap .toolbar,
    .export-snap aside,
    .export-snap .toast-host,
    .export-snap .drawer,
    .export-snap .drawer-backdrop,
    .export-snap .tooltip {
      display: none !important;
    }
    .export-snap.app {
      grid-template-columns: 1fr;
    }
    .export-snap main { padding: 24px; }
    .export-stamp {
      margin: 0 0 12px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcf8;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 16px; }
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .drawer-hero { grid-template-columns: 1fr; }
      .drawer-hero img { width: 100%; height: 220px; }
    }
  </style>
</head>

      if (key) {
        const existing = toastHost.querySelector(`[data-toast-key="${key}"]`);
        if (existing) existing.remove();
      }
      const node = document.createElement("div");
      node.className = "toast";
      if (key) node.dataset.toastKey = key;
      node.innerHTML = `<span>${escapeHtml(message)}</span>`;
      if (actionLabel) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = actionLabel;
        btn.addEventListener("click", () => {
          if (onAction) onAction();
          node.classList.remove("show");
          setTimeout(() => node.remove(), 200);
        });
        node.appendChild(btn);
      }
      toastHost.appendChild(node);
      requestAnimationFrame(() => node.classList.add("show"));
      if (duration > 0) {
        setTimeout(() => {
          node.classList.remove("show");
          setTimeout(() => node.remove(), 220);
        }, duration);
      }
      return node;
    }

    // —— Cloudflare Worker 同步 ——
    let cloudSyncTimer = null;
    let lastSyncedAt = null;
    function updateSyncStatus(state, detail) {
      const el = document.getElementById("syncStatus");
      if (!el) return;
      el.dataset.state = state;
      const labels = {
        init: "初始化…",
        loading: "拉取云端…",
        synced: lastSyncedAt ? `已同步 ${formatRelativeTs(lastSyncedAt)}` : "云端最新",
        pending: "待保存…",
        syncing: "保存中…",
        error: detail ? `同步失败：${detail}` : "同步失败",
        unauthorized: "鉴权失败 — 请重新登录",
        local: syncEnabled() ? "本地数据（未登录）" : "本地数据（未接云）",
        viewer: syncEnabled() ? "云端最新" : "本地数据",
        offline: "云端离线",
      };
      el.textContent = labels[state] || state;
      el.title = detail || labels[state] || state;
    }
    function formatRelativeTs(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const sec = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
      if (sec < 30) return "刚刚";
      if (sec < 90) return "1 分钟前";
      if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
      if (sec < 86400) return `${Math.floor(sec / 3600)} 小时前`;
      return `${Math.floor(sec / 86400)} 天前`;
    }
    async function loadFromCloud() {
      if (!syncEnabled()) return null;
      updateSyncStatus("loading");
      try {
        const res = await fetch(WORKER_URL + "/api/roadmap", { method: "GET", cache: "no-store" });
        if (!res.ok) { updateSyncStatus("offline", `HTTP ${res.status}`); return null; }
        const body = await res.json();
        if (!body || !Array.isArray(body.rows)) {
          // 云端还没有数据；保留 BAKED_ROWS，但状态显示 synced（云端为空，等管理员第一次保存）
          updateSyncStatus(isAdmin() ? "synced" : "viewer");
          return null;
        }
        lastSyncedAt = body.savedAt || null;
        updateSyncStatus(isAdmin() ? "synced" : "viewer");
        return body.rows;
      } catch (e) {
        updateSyncStatus("offline", e.message || "network");
        return null;
      }
    }
    function scheduleCloudSync() {
      if (!syncEnabled() || !isAdmin() || !getAdminToken()) return;
      clearTimeout(cloudSyncTimer);
      updateSyncStatus("pending");
      cloudSyncTimer = setTimeout(pushCloudSync, SYNC_DEBOUNCE_MS);
    }
    async function pushCloudSync() {
      if (!syncEnabled() || !isAdmin()) return;
      const token = getAdminToken();
      if (!token) { updateSyncStatus("unauthorized"); return; }
      updateSyncStatus("syncing");
      try {
        const rows = productsToRows();
        const res = await fetch(WORKER_URL + "/api/roadmap", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify(rows),
        });
        if (res.status === 401) { updateSyncStatus("unauthorized"); return; }
        if (!res.ok) { updateSyncStatus("error", `HTTP ${res.status}`); return; }
        const body = await res.json().catch(() => ({}));
        lastSyncedAt = body.savedAt || new Date().toISOString();
        dirty = false;
        updateSyncStatus("synced");
      } catch (e) {
        updateSyncStatus("error", e.message || "network");
      }
    }
    // 把当前 products[] 序列化回扁平的 BAKED_ROWS 风格行数组（每 SKU 一行）
    function productsToRows() {
      return products.flatMap(product => {
        const variants = product.variants && product.variants.length ? product.variants : [{
          spu: product.spu, sku: product.spu, config: "", color: product.color || "",

          img: product.img || "", main: product.main || "", secondary: product.secondary || "",

        }];
        return variants.map(variant => ({
          spu: variant.spu || product.spu || "",

          productGroup: product.productGroup || product.spu || "",
          color: variant.color || "",

          name: product.name || product.spu || "",
          category: product.category || "",

    // —— URL state 持久化 + 深链接 ——
    let suppressHashSync = false;
    function syncRouteToHash() {
      if (suppressHashSync) return;
      const parts = [`view=${encodeURIComponent(state.view)}`];
      if (state.openedSpu) parts.push(`spu=${encodeURIComponent(state.openedSpu)}`);
      const hash = `#${parts.join("&")}`;
      if (location.hash !== hash) {
        suppressHashSync = true;
        history.replaceState(null, "", hash);
        suppressHashSync = false;
      }
    }
    function parseHash() {
      const raw = String(location.hash || "").replace(/^#/, "");
      if (!raw) return {};
      const out = {};
      raw.split("&").forEach(pair => {
        const [k, v] = pair.split("=");
        if (!k) return;
        out[decodeURIComponent(k)] = v ? decodeURIComponent(v) : "";
      });
      return out;
    }
    function applyHashToState() {
      const route = parseHash();
      let needRender = false;
      if (route.view && route.view !== state.view) {
        const validViews = new Set(["exec", "matrix", "timeline", "gap", "deps", "diff"]);
        if (validViews.has(route.view)) {
          state.view = route.view;
          document.querySelectorAll(".view-toggle button").forEach(btn => btn.classList.toggle("active", btn.dataset.view === state.view));
          needRender = true;
        }
      }
      if (needRender) render();
      if (route.spu) {
        const wanted = route.spu.toLowerCase();
        const product = products.find(p => (p.productGroup || p.spu || "").toLowerCase() === wanted || (p.variantSpus || []).some(s => String(s).toLowerCase() === wanted));
        if (product) {
          state.openedSpu = product.productGroup || product.spu;
          openDrawer(product);
        }
      }
    }

    async function exportCurrentViewAsPdf() {
      if (!window.htmlToImage || !window.jspdf) {
        showToast("PDF 导出库未加载，请联网后刷新页面。", { duration: 3500 });
        return;
      }
      const root = document.querySelector(".app");
      const main = root.querySelector("main");
      const stamp = document.createElement("div");
      const now = new Date();
      const ymd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const viewLabel = { exec: "执行摘要", matrix: "档位矩阵", timeline: "时间线", gap: "档位 × 渠道空缺", deps: "依赖关系", diff: "版本对比" }[state.view] || state.view;
      stamp.className = "export-stamp";
      stamp.textContent = `产品 Roadmap · ${viewLabel} · 导出于 ${ymd}`;
      main.insertBefore(stamp, main.firstChild);
      root.classList.add("export-snap");
      showToast("PDF 渲染中…可能需要 3-6 秒", { duration: 2200 });
      try {
        const dataUrl = await window.htmlToImage.toPng(main, {
          pixelRatio: 2,
          backgroundColor: "#f5f6f2",
          cacheBust: true,
          filter: node => !(node.classList && (node.classList.contains("toast-host") || node.classList.contains("tooltip") || node.classList.contains("drawer") || node.classList.contains("drawer-backdrop")))
        });
        // 把 PNG 装进 A4 横向 PDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        // 计算图片在 PDF 中的尺寸（按宽度等比）
        await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const ratio = img.height / img.width;
            const targetW = pageW - 16;
            let targetH = targetW * ratio;
            if (targetH <= pageH - 16) {
              pdf.addImage(dataUrl, "PNG", 8, 8, targetW, targetH);
            } else {
              // 多页
              const pxPerMm = img.width / targetW;
              const pageHeightPx = (pageH - 16) * pxPerMm;
              let offsetPx = 0;
              let pageIdx = 0;
              const canvas = document.createElement("canvas");
              canvas.width = img.width;
              canvas.height = pageHeightPx;
              const ctx = canvas.getContext("2d");
              while (offsetPx < img.height) {
                if (pageIdx > 0) pdf.addPage();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, -offsetPx);
                const pageDataUrl = canvas.toDataURL("image/png");
                const slicePxHeight = Math.min(pageHeightPx, img.height - offsetPx);
                pdf.addImage(pageDataUrl, "PNG", 8, 8, targetW, slicePxHeight / pxPerMm);
                offsetPx += pageHeightPx;
                pageIdx++;
              }
            }
            resolve();
          };
          img.onerror = reject;
          img.src = dataUrl;
        });
        pdf.save(`product-roadmap-${state.view}-${ymd.replace(/[: ]/g, "-")}.pdf`);
        showToast(`已导出 ${viewLabel} 视图为 PDF`, { duration: 2800 });
      } catch (err) {
        console.error(err);
        showToast(`PDF 导出失败：${err.message || err}`, { duration: 4500 });
      } finally {
        root.classList.remove("export-snap");
        stamp.remove();
      }
    }

        const imported = rows.map(row => normalizeRow(row, imagesByRow[row.__rowNumber])).filter(p => p.spu);
        if (!imported.length) throw new Error("没有识别到有效产品行，请检查 SPU 列。 ");

          syncDimensionsFromProducts();

          render();
          const imageCount = imported.filter(p => p.img && p.img.startsWith("data:image/")).length;
          const imageNote = /\.xlsx$/i.test(file.name) ? `，读取 ${imageCount} 张嵌入图片` : "；CSV/TSV 不支持嵌入图片";
          importStatus.textContent = `已导入 ${imported.length} 个 SPU，合并为 ${products.length} 张卡${imageNote}：${file.name}`;
        } catch (error) {

      if (/\.csv$|\.tsv$/i.test(file.name)) reader.readAsText(file, "utf-8");
      else reader.readAsArrayBuffer(file);
    }

    async function parseWorkbook(file, payload) {
      if (/\.csv$/i.test(file.name)) return { rows: parseDelimited(payload, ","), imagesByRow: {} };
      if (/\.tsv$/i.test(file.name)) return { rows: parseDelimited(payload, "\t"), imagesByRow: {} };
      if (!window.XLSX) throw new Error("Excel 解析库未加载；请联网后刷新页面，或先另存为 CSV 导入。 ");
      const workbook = XLSX.read(payload, { type: "array" });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const matrix = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "", blankrows: false });
      const headers = (matrix[0] || []).map(value => String(value).trim());
      const imageColumn = headers.findIndex(header => ["图片", "image", "photo", "产品图片"].includes(header.toLowerCase())) + 1;
      const rows = matrix.slice(1).filter(row => row.some(Boolean)).map((row, index) => {
        const record = Object.fromEntries(headers.map((header, colIndex) => [header, row[colIndex] || ""]));
        record.__rowNumber = index + 2;
        return record;
      });
      const imagesByRow = /\.xlsx$/i.test(file.name) ? await extractExcelImages(payload, imageColumn) : {};
      return { rows, imagesByRow };
    }

    function parseDelimited(text, delimiter) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && quoted && next === '"') { value += '"'; i++; continue; }
        if (char === '"') { quoted = !quoted; continue; }
        if (char === delimiter && !quoted) { row.push(value); value = ""; continue; }
        if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i++;
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          continue;
        }
        value += char;
      }
      row.push(value);
      rows.push(row);
      const headers = rows.shift().map(h => h.trim());
      return rows.filter(r => r.some(Boolean)).map((r, index) => {
        const record = Object.fromEntries(headers.map((h, i) => [h, r[i] || ""]));
        record.__rowNumber = index + 2;
        return record;
      });
    }

    async function extractExcelImages(payload, imageColumn) {
      if (!window.JSZip || !imageColumn) return {};
      const zip = await JSZip.loadAsync(payload);
      const richDataImages = await extractRichDataImages(zip, imageColumn);
      const sheetPath = "xl/worksheets/sheet1.xml";
      const sheet = zip.file(sheetPath);
      if (!sheet) return {};

      const sheetXml = await sheet.async("text");
      const sheetDoc = parseXml(sheetXml);
      const drawingEl = firstByLocal(sheetDoc, "drawing");
      if (!drawingEl) return richDataImages;

      const drawingRid = drawingEl.getAttribute("r:id") || drawingEl.getAttribute("id");
      const sheetRels = await readRelationships(zip, "xl/worksheets/_rels/sheet1.xml.rels");
      const drawingPath = resolveZipPath("xl/worksheets", sheetRels[drawingRid]);
      if (!drawingPath || !zip.file(drawingPath)) return {};

      const drawingXml = await zip.file(drawingPath).async("text");
      const drawingDoc = parseXml(drawingXml);
      const drawingRels = await readRelationships(zip, `${dirName(drawingPath)}/_rels/${baseName(drawingPath)}.rels`);
      const imagesByRow = {};
      const fallbackImagesByRow = {};

      Array.from(drawingDoc.getElementsByTagName("*")).filter(el => ["twoCellAnchor", "oneCellAnchor"].includes(el.localName)).forEach(anchor => {
        const from = firstByLocal(anchor, "from");
        const blip = firstByLocal(anchor, "blip");
        if (!from || !blip) return;
        const row = Number(textByLocal(from, "row")) + 1;
        const col = Number(textByLocal(from, "col")) + 1;
        const rid = blip.getAttribute("r:embed") || blip.getAttribute("embed");
        const mediaPath = resolveZipPath(dirName(drawingPath), drawingRels[rid]);
        if (!mediaPath || !zip.file(mediaPath)) return;
        if (!fallbackImagesByRow[row]) fallbackImagesByRow[row] = mediaPath;
        if (imageColumn && col === imageColumn && !imagesByRow[row]) imagesByRow[row] = mediaPath;
      });

      const mergedImagesByRow = { ...richDataImages, ...fallbackImagesByRow, ...imagesByRow };
      for (const [row, mediaPath] of Object.entries(mergedImagesByRow)) {
        if (String(mediaPath).startsWith("data:image/")) continue;
        const bytes = await zip.file(mediaPath).async("base64");
        mergedImagesByRow[row] = `data:${mimeFromPath(mediaPath)};base64,${bytes}`;
      }
      return mergedImagesByRow;

    async function extractRichDataImages(zip, imageColumn) {
      const sheet = zip.file("xl/worksheets/sheet1.xml");
      const richValues = zip.file("xl/richData/rdrichvalue.xml");
      const richValueRels = zip.file("xl/richData/richValueRel.xml");
      const richRels = zip.file("xl/richData/_rels/richValueRel.xml.rels");
      if (!sheet || !richValues || !richValueRels || !richRels) return {};

      const sheetDoc = parseXml(await sheet.async("text"));
      const cells = Array.from(sheetDoc.getElementsByTagName("*")).filter(el => el.localName === "c");
      const imageCells = cells.map(cell => {
        const ref = cell.getAttribute("r") || "";
        const match = ref.match(/^([A-Z]+)(\d+)$/);
        const vm = cell.getAttribute("vm");
        if (!match || !vm) return null;
        const col = columnLettersToNumber(match[1]);
        if (col !== imageColumn) return null;
        return { row: Number(match[2]), richIndex: Number(vm) - 1 };
      }).filter(Boolean);
      if (!imageCells.length) return {};

      const richDoc = parseXml(await richValues.async("text"));
      const richRelDoc = parseXml(await richValueRels.async("text"));
      const richRelIds = Array.from(richRelDoc.getElementsByTagName("*")).filter(el => el.localName === "rel").map(rel => rel.getAttribute("r:id") || rel.getAttribute("id"));
      const mediaByRid = await readRelationships(zip, "xl/richData/_rels/richValueRel.xml.rels");

        const values = Array.from(rv.children).filter(child => child.localName === "v").map(child => Number(child.textContent));
        const relIndex = values[0];
        return richRelIds[relIndex];
      });

      const imagesByRow = {};
      for (const cell of imageCells) {
        const rid = rvItems[cell.richIndex];
        const mediaPath = resolveZipPath("xl/richData", mediaByRid[rid]);
        if (!mediaPath || !zip.file(mediaPath)) continue;

    function resolveZipPath(baseDir, target) {
      if (!target) return "";
      if (target.startsWith("/")) return target.slice(1);
      const parts = `${baseDir}/${target}`.split("/");
      const stack = [];
      parts.forEach(part => {
        if (!part || part === ".") return;
        if (part === "..") stack.pop();
        else stack.push(part);
      });
      return stack.join("/");
    }

    function parseDateLoose(value) {
      if (!value) return "";
      const text = String(value).trim();
      const isoMatch = text.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (isoMatch) {
        const d = new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));
        if (!isNaN(d.getTime())) return d.toISOString();
      }
      const num = Number(text);
      if (Number.isFinite(num) && num > 25569 && num < 80000) {
        // Excel serial date number — days since 1899-12-30
        const ms = Math.round((num - 25569) * 86400000);
        return new Date(ms).toISOString();
      }
      const parsed = new Date(text);
      return isNaN(parsed.getTime()) ? "" : parsed.toISOString();
    }

    function formatDateShort(value) {
      if (!value) return "";
      const d = new Date(value);
      if (isNaN(d.getTime())) return "";
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function relativeDays(value) {
      if (!value) return null;
      const d = new Date(value);
      if (isNaN(d.getTime())) return null;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    }

    function formatRelative(value) {
      const days = relativeDays(value);
      if (days === null) return "未记录更新";
      if (days <= 0) return "今天";
      if (days === 1) return "昨天";
      if (days < 30) return `${days} 天前`;
      if (days < 365) return `${Math.floor(days / 30)} 个月前`;
      return `${Math.floor(days / 365)} 年前`;
    }

    function isStale(value, threshold = 30) {
      const days = relativeDays(value);
      return days !== null && days >= threshold;
    }

      const parsed = prices.map(parsePriceRange).filter(Boolean);
      if (parsed.length !== prices.length) return prices.join(" / ");
      const min = Math.min(...parsed.map(item => item.min));
      const max = Math.max(...parsed.map(item => item.max));
      const currency = parsed.find(item => item.currency)?.currency || "";
      if (min === max) return `${currency}${formatPrice(min)}`;
      return `${currency}${formatPrice(min)}-${currency}${formatPrice(max)}`;

        ["", "Nest E100", "含太阳能板 / 户外长续航", "承担户外场景加价和差异化卖点", "SHOPIFY/SAMS", "$69.99", "Wood", "nest", "E", "2026 Q3", "ITER", "$49.99", "同一 SPU 多个配置可重复 SPU；每行维护一个 SKU 配置；SPU 渠道由 SKU渠道自动汇总", "低价位铺量", "户外长续航", "E 档入口，Solar 配置承担轻差异化", "基础款拉新，Solar 配置提升 ASP", "张三", "yellow", "Solar 模组成本待重谈", "温控主板 v1", "Nest E100", "Solar 配置需追加 IP67 测试", "2026-05-12", "K&H Heated Bed", "K&H", "多个竞品图片建议用 | 分隔", "$45-90", "Amazon / Chewy", "温控休息场景成熟", "用长续航配置和渠道组合应对"]
      ];
      if (window.XLSX) {
        const worksheet = XLSX.utils.aoa_to_sheet([headers, ...samples]);
        worksheet["!cols"] = headers.map(header => ({ wch: header === "图片" ? 24 : 16 }));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Roadmap");
        XLSX.writeFile(workbook, "product-roadmap-template.xlsx");

      downloadCsvFallback(headers, samples, "product-roadmap-template.csv");
