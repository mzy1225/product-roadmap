    function exportRoadmap(format) {
      const headers = roadmapHeaders();
      const rows = exportRows();
      if (!rows.length) {
        importStatus.textContent = "暂无可导出的产品数据。";
        return;
      }
      if (format === "xlsx") {
        if (!window.XLSX) {
          importStatus.textContent = "Excel 导出库未加载，请改用 CSV 导出。";
          return;
        }
        const worksheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        worksheet["!cols"] = headers.map(header => ({ wch: header === "图片" ? 24 : 16 }));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Roadmap");
        XLSX.writeFile(workbook, "product-roadmap-export.xlsx");
        importStatus.textContent = `已导出 ${rows.length} 条 SKU：product-roadmap-export.xlsx`;
        return;
      }
      downloadCsvFallback(headers, rows, "product-roadmap-export.csv");
      importStatus.textContent = `已导出 ${rows.length} 条 SKU：product-roadmap-export.csv`;
    }

    function exportRows() {
      return products.flatMap(product => {
        const competitors = product.competitors || [];
        const names = competitors.map(item => item.name).filter(Boolean).join(" / ");
        const companies = competitors.map(item => item.company).filter(Boolean).join(" / ");
        const images = competitors.map(item => item.img).filter(Boolean).join(" | ");
        const prices = competitors.map(item => item.price).filter(Boolean).join(" / ");
        const channelsText = competitors.map(item => item.channel).filter(Boolean).join(" / ");
        const points = competitors.map(item => item.point).filter(Boolean).join(" / ");
        const responses = competitors.map(item => item.response).filter(Boolean).join(" / ");
        const variants = product.variants && product.variants.length ? product.variants : [{ spu: product.spu, sku: product.spu, color: product.color, config: "", position: "", channels: product.channels, mapPrice: product.mapPrice, img: product.img, main: product.main, secondary: product.secondary }];
        return variants.map(variant => [
          product.productGroup || "",
          variant.spu || product.spu || "",
          variant.config || "",
          variant.position || "",
          variant.channels && variant.channels.length ? variant.channels.join("/") : "",
          variant.mapPrice || "",
          variant.color || "",
          product.category || "",
          product.tier || "",
          product.quarter || "",
          normalizeStatus(variant.status),
          product.mapPrice || "",
          variant.img && !isPlaceholderImage(variant.img) ? variant.img : "",
          variant.main || product.main || "",
          variant.secondary || product.secondary || "",
          product.position || "",
          product.role || "",
          product.owner || "",
          product.health || "green",
          product.decision || "",
          product.platform || "",
          (product.dependencies || []).join(" / "),
          variant.notes || "",
          formatDateShort(product.lastUpdated),
          names,
          companies,
          images,
          prices,
          channelsText,
          points,
          responses
        ]);
      });
    }

    function downloadCsvFallback(headers, samples, filename = "product-roadmap-template.csv") {
      const csv = [headers, ...samples].map(row => row.map(cell => `"${String(cell ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function titleCase(value) {
      return value.split(/\s+/).map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(" ");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }

    function filteredProducts() {
      return products.filter(p => {
        const competitorText = (p.competitors || []).flatMap(c => [c.name, c.company, c.price, c.channel, c.point, c.response]);
        const variantText = (p.variants || []).flatMap(v => [
          v.spu, v.sku, v.color, v.config, v.status, v.position, v.mapPrice, ...(v.channels || [])
        ]);
        const text = [p.spu, p.productGroup, p.name, p.category, p.tier, p.quarter, p.mapPrice, p.main, p.secondary, p.position, p.role, ...p.channels, ...variantText, ...competitorText].join(" ").toLowerCase();
        const variants = p.variants || [];
        const statusMatch = variants.some(variant => state.statuses.has(normalizeStatus(variant.status)));
        return state.tiers.has(p.tier) && p.channels.some(c => state.channels.has(c)) && statusMatch && text.includes(state.query);
      });
    }

    function renderStats(items) {
      const uniqueChannels = new Set(items.flatMap(p => p.channels));
      const competitorCount = items.reduce((sum, p) => sum + (p.competitors || []).length, 0);
      const spuCount = new Set(items.flatMap(p => p.variantSpus && p.variantSpus.length ? p.variantSpus : [p.spu]).filter(Boolean)).size;
      const skuCount = items.reduce((sum, p) => sum + (p.variantCount || 1), 0);
      stats.innerHTML = [
        [spuCount, "SPU"],
        [skuCount, "SKU"],
        [uniqueChannels.size, "渠道"],
        [items.length, "产品卡"],
        [competitorCount, "对应竞品"]
      ].map(([value, label]) => `<div class="stat"><div class="value">${value}</div><div class="label">${label}</div></div>`).join("");
    }

    function render() {
      const items = filteredProducts();
      renderStats(items);
      switch (state.view) {
        case "exec":     renderExecutive(items); break;
        case "timeline": renderTimeline(items);  break;
        case "gap":      renderGapMatrix(items); break;
        case "deps":     renderDependencies(items); break;
        case "diff":     renderDiff(items); break;
        case "matrix":
        default:         renderMatrix(items);
      }
      attachProductEvents();
      syncRouteToHash();
    }

    function renderDependencies(items) {
      roadmap.className = "roadmap deps-roadmap";
      roadmap.style.gridTemplateColumns = "1fr";

      // 按平台聚合
      const byPlatform = new Map();
      const orphans = [];
      items.forEach(p => {
        const key = p.platform || "";
        if (!key) { orphans.push(p); return; }
        if (!byPlatform.has(key)) byPlatform.set(key, []);
        byPlatform.get(key).push(p);
      });

      // 依赖边：FROM -> TO 反向显示
      const cardsBySpu = new Map(items.map(p => [(p.productGroup || p.spu).toLowerCase(), p]));
      const edges = [];
      items.forEach(p => {
        (p.dependencies || []).forEach(dep => {
          const target = cardsBySpu.get(String(dep).trim().toLowerCase());
          edges.push({ from: p, to: target, depCode: dep });
        });
      });

      const platformHtml = Array.from(byPlatform.entries())
        .sort((a, b) => b[1].length - a[1].length)
        .map(([platform, list]) => {
          const sharedNote = list.length > 1 ? `<span style="color:#bf6f2e;font-weight:800">⚠ ${list.length} 个 SPU 共用此平台，任何延期会同时影响</span>` : `单 SPU 使用`;
          const chips = list.map(p => `<span class="dep-chip" data-card-id="${escapeHtml(p.cardId)}" title="${escapeHtml(p.productGroup || p.spu)}"><span class="health-dot health-${escapeHtml(p.health || "green")}"></span>${escapeHtml(p.productGroup || p.spu)} <span style="color:var(--muted);font-size:11px">· ${escapeHtml(p.tier)} · ${escapeHtml(p.quarter)}</span></span>`).join("");
          return `<div class="platform-block">
            <h2>${escapeHtml(platform)}</h2>
            <div class="platform-meta">${sharedNote}</div>
            <div class="platform-spus">${chips}</div>
          </div>`;
        }).join("");

      const orphanHtml = orphans.length ? `<div class="platform-block">
        <h2 style="color:var(--muted)">未指定平台 / 模组（${orphans.length}）</h2>
        <div class="platform-meta">建议补充"平台模组"字段以追踪硬件/软件共用关系</div>
        <div class="platform-spus">${orphans.map(p => `<span class="dep-chip" data-card-id="${escapeHtml(p.cardId)}"><span class="health-dot health-${escapeHtml(p.health || "green")}"></span>${escapeHtml(p.productGroup || p.spu)}</span>`).join("")}</div>
      </div>` : "";

      const edgeHtml = edges.length ? `<div class="platform-block">
        <h2>跨 SPU 依赖关系</h2>
        <div class="platform-meta">下游 SPU 受上游 SPU 影响，看依赖链识别风险传导</div>
        ${edges.map(e => {
          const fromCode = e.from.productGroup || e.from.spu;
          const toCode = e.to ? (e.to.productGroup || e.to.spu) : e.depCode;
          const toCardId = e.to ? e.to.cardId : "";
          const toHealth = e.to ? (e.to.health || "green") : "na";
          const fromHealth = e.from.health || "green";
          const warn = e.to && (toHealth === "red" || toHealth === "yellow") ? `<strong style="color:#8a242c"> · 上游有风险 ⚠</strong>` : "";
          const missing = !e.to ? `<span style="color:#8a242c"> · 在当前筛选中未找到</span>` : "";
          return `<div class="dep-edge"><code data-card-id="${escapeHtml(e.from.cardId)}" title="点击查看"><span class="health-dot health-${escapeHtml(fromHealth)}" style="margin-right:4px"></span>${escapeHtml(fromCode)}</code> 依赖 <code${toCardId ? ` data-card-id="${escapeHtml(toCardId)}"` : ""}><span class="health-dot health-${escapeHtml(toHealth)}" style="margin-right:4px"></span>${escapeHtml(toCode)}</code>${warn}${missing}</div>`;
        }).join("")}
      </div>` : "";

      roadmap.innerHTML = `<div class="deps-wrap">${platformHtml}${orphanHtml}${edgeHtml || `<div class="exec-empty">尚未配置跨 SPU 依赖关系。可在 drawer 的"依赖 SPU"字段填写</div>`}</div>`;
    }

    // —— Baseline 存取（localStorage） ——
    const BASELINE_KEY = "roadmap-baseline-v1";

    function snapshotForBaseline(productList) {
      // 剥离 img 等大字段，避免 localStorage 超额
      return productList.map(p => ({
        productGroup: p.productGroup || "",
        spu: p.spu,
        category: p.category,
        tier: p.tier,
        quarter: p.quarter || "",
        mapPrice: p.mapPrice || "",
        channels: [...(p.channels || [])],
        main: p.main || "",
        secondary: p.secondary || "",
        position: p.position || "",
        role: p.role || "",
        owner: p.owner || "",
        health: p.health || "green",
        decision: p.decision || "",
        platform: p.platform || "",
        dependencies: [...(p.dependencies || [])],
        statuses: [...(p.statuses || [])],
        variants: (p.variants || []).map(v => ({
          spu: v.spu, sku: v.sku || v.spu, color: v.color || "", config: v.config || "",
          status: normalizeStatus(v.status), position: v.position || "",
          channels: [...(v.channels || [])], mapPrice: v.mapPrice || "",
          main: v.main || "", secondary: v.secondary || "", notes: v.notes || ""
        }))
      }));
    }

    function saveBaseline() {
      try {
        const payload = { savedAt: new Date().toISOString(), products: snapshotForBaseline(products) };
        localStorage.setItem(BASELINE_KEY, JSON.stringify(payload));
        showToast(`已保存基准（${payload.products.length} 个 SPU）。切到"对比"视图随时对比变化。`, { duration: 3200 });
        if (state.view === "diff") render();
      } catch (err) {
        showToast(`保存基准失败：${err.message || err}`, { duration: 4000 });
      }
    }

    function loadBaseline() {
      try {
        const raw = localStorage.getItem(BASELINE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function clearBaseline() {
      localStorage.removeItem(BASELINE_KEY);
      showToast("已清除基准", { duration: 2200 });
      if (state.view === "diff") render();
    }

    function importBaselineFromFile() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".xlsx,.csv,.tsv";
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async e => {
          try {
            const { rows } = await parseWorkbook(file, e.target.result);
            const imported = rows.map(row => normalizeRow(row, undefined)).filter(p => p.spu);
            const baseProducts = groupProductVariants(imported);
            const payload = { savedAt: new Date().toISOString(), products: snapshotForBaseline(baseProducts), sourceFile: file.name };
            localStorage.setItem(BASELINE_KEY, JSON.stringify(payload));
            showToast(`已用 ${file.name}（${baseProducts.length} 个 SPU）作为基准`, { duration: 3500 });
            if (state.view === "diff") render();
          } catch (err) {
            showToast(`导入基准失败：${err.message || err}`, { duration: 4500 });
          }
        };
        if (/\.csv$|\.tsv$/i.test(file.name)) reader.readAsText(file, "utf-8");
        else reader.readAsArrayBuffer(file);
      });
      input.click();
    }

    function diffProducts(baseline, current) {
      const baselineMap = new Map(baseline.products.map(p => [(p.productGroup || p.spu).toLowerCase(), p]));
      const currentMap = new Map(current.map(p => [(p.productGroup || p.spu).toLowerCase(), p]));
      const added = [];
      const removed = [];
      const modified = [];
      const trackFields = ["quarter", "mapPrice", "channels", "main", "secondary", "position", "role", "owner", "health", "decision", "tier", "category", "platform", "dependencies", "statuses"];
      currentMap.forEach((cur, key) => {
        if (!baselineMap.has(key)) {
          added.push(cur);
          return;
        }
        const base = baselineMap.get(key);
        const changes = [];
        trackFields.forEach(field => {
          const a = stringifyForDiff(base[field]);
          const b = stringifyForDiff(cur[field]);
          if (a !== b) changes.push({ field, from: a, to: b });
        });
        // 变体级变化（按 sku/config 匹配）
        const baseVariants = base.variants || [];
        const curVariants = cur.variants || [];
        if (baseVariants.length !== curVariants.length) {
          changes.push({ field: "SKU 数量", from: String(baseVariants.length), to: String(curVariants.length) });
        }
        if (changes.length) modified.push({ product: cur, changes });
      });
      baselineMap.forEach((base, key) => {
        if (!currentMap.has(key)) removed.push(base);
      });
      return { added, removed, modified };
    }

    function stringifyForDiff(value) {
      if (Array.isArray(value)) return [...value].sort().join(" / ");
      if (value === undefined || value === null) return "";
      return String(value);
    }

    function renderDiff(items) {
      roadmap.className = "roadmap diff-roadmap";
      roadmap.style.gridTemplateColumns = "1fr";
      const baseline = loadBaseline();
      if (!baseline) {
        roadmap.innerHTML = `<div class="diff-wrap">
          <div class="diff-head">
            <strong>版本对比 · 基准未设置</strong>
            <span class="diff-empty">先点上方"保存为基准"把当前状态存为基准，或导入一份历史 Excel 作为基准</span>
            <div style="margin-left:auto;display:flex;gap:6px">
              <button id="diffImportBtn" class="secondary-btn admin-only" type="button">导入基准 Excel</button>
            </div>
          </div>
          <div class="exec-empty">基准设置后，这里会显示新增 / 移除 / 字段变更，按字段高亮 before → after</div>
        </div>`;
        const importBtn = document.getElementById("diffImportBtn");
        if (importBtn) importBtn.addEventListener("click", importBaselineFromFile);
        return;
      }

      const diff = diffProducts(baseline, items);
      const savedAt = formatDateShort(baseline.savedAt) + " " + new Date(baseline.savedAt).toLocaleTimeString().slice(0, 5);
      const sourceLabel = baseline.sourceFile ? `（来自 ${escapeHtml(baseline.sourceFile)}）` : "";

      const renderProductLine = p => `<strong data-card-id="${escapeHtml(p.cardId || "")}">${escapeHtml(p.productGroup || p.spu)} <span style="color:var(--muted);font-weight:650">· ${escapeHtml(p.tier || "")} · ${escapeHtml(p.quarter || "")}</span></strong>`;

      const addedHtml = diff.added.length ? `<div class="diff-section">
        <h2 class="added">新增 SPU · ${diff.added.length}</h2>
        <div class="diff-list">${diff.added.map(p => `<div class="diff-item">${renderProductLine(p)}<div class="diff-changes"><div class="diff-change"><b>主战役</b><span>${escapeHtml(p.main || "—")}</span></div><div class="diff-change"><b>负责人</b><span>${escapeHtml(p.owner || "—")}</span></div></div></div>`).join("")}</div>
      </div>` : "";

      const removedHtml = diff.removed.length ? `<div class="diff-section">
        <h2 class="removed">从基准中移除 · ${diff.removed.length}</h2>
        <div class="diff-list">${diff.removed.map(p => `<div class="diff-item"><strong>${escapeHtml(p.productGroup || p.spu)} <span style="color:var(--muted);font-weight:650">· ${escapeHtml(p.tier || "")} · ${escapeHtml(p.quarter || "")}</span></strong></div>`).join("")}</div>
      </div>` : "";

      const fieldLabels = { quarter: "季度", mapPrice: "MAP", channels: "渠道", main: "主战役", secondary: "次战役", position: "战略定位", role: "核心职责", owner: "负责人", health: "健康度", decision: "需决策", tier: "档位", category: "品类", platform: "平台模组", dependencies: "依赖 SPU", statuses: "状态" };

      const modifiedHtml = diff.modified.length ? `<div class="diff-section">
        <h2 class="modified">字段变更 · ${diff.modified.length}</h2>
        <div class="diff-list">${diff.modified.map(({ product: p, changes }) => `<div class="diff-item">${renderProductLine(p)}<div class="diff-changes">${changes.map(c => `<div class="diff-change"><b>${escapeHtml(fieldLabels[c.field] || c.field)}</b><span><span class="from">${escapeHtml(c.from || "—")}</span><span class="arrow">→</span><span class="to">${escapeHtml(c.to || "—")}</span></span></div>`).join("")}</div></div>`).join("")}</div>
      </div>` : "";

      const nothing = !diff.added.length && !diff.removed.length && !diff.modified.length
        ? `<div class="exec-empty">当前状态与基准完全一致</div>`
        : "";

      roadmap.innerHTML = `<div class="diff-wrap">
        <div class="diff-head">
          <div>
            <strong>对比基准 · ${escapeHtml(savedAt)} ${sourceLabel}</strong>
            <div class="diff-summary" style="margin-top:6px">
              <span class="pill added">+${diff.added.length}</span>
              <span class="pill removed">−${diff.removed.length}</span>
              <span class="pill modified">±${diff.modified.length}</span>
            </div>
          </div>
          <div style="margin-left:auto;display:flex;gap:6px">
            <button id="diffImportBtn" class="secondary-btn admin-only" type="button">替换为新基准</button>
            <button id="diffClearBtn" class="secondary-btn admin-only" type="button">清除基准</button>
          </div>
        </div>
        ${addedHtml}${removedHtml}${modifiedHtml}${nothing}
      </div>`;
      const importBtn = document.getElementById("diffImportBtn");
      const clearBtn = document.getElementById("diffClearBtn");
      if (importBtn) importBtn.addEventListener("click", importBaselineFromFile);
      if (clearBtn) clearBtn.addEventListener("click", clearBaseline);
    }

    function renderExecutive(items) {
      roadmap.className = "roadmap exec-roadmap";
      roadmap.style.gridTemplateColumns = "1fr";

      // 1. 按主战役聚合 + 健康度统计
      const campaignMap = new Map();
      items.forEach(p => {
        const key = p.main || "未分类战役";
        if (!campaignMap.has(key)) campaignMap.set(key, { name: key, items: [], red: 0, yellow: 0, green: 0, owners: new Set(), quarters: new Set() });
        const bucket = campaignMap.get(key);
        bucket.items.push(p);
        bucket[p.health || "green"] = (bucket[p.health || "green"] || 0) + 1;
        if (p.owner) bucket.owners.add(p.owner);
        if (p.quarter) bucket.quarters.add(p.quarter);
      });
      const campaigns = Array.from(campaignMap.values()).sort((a, b) => (b.red - a.red) || (b.yellow - a.yellow) || (b.items.length - a.items.length));

      // 2. 高风险 SPU
      const riskItems = items
        .filter(p => p.health === "red" || p.health === "yellow")
        .sort((a, b) => healthRank(b.health) - healthRank(a.health));

      // 3. 需要决策事项
      const decisions = items.filter(p => String(p.decision || "").trim());

      const campaignHtml = campaigns.length ? campaigns.map(c => {
        const dominantHealth = c.red ? "red" : c.yellow ? "yellow" : "green";
        const owners = Array.from(c.owners).join(" · ") || "—";
        const quarters = Array.from(c.quarters).sort((a, b) => quarterRank(a) - quarterRank(b)).join(" / ") || "—";
        return `<div class="campaign-row health-${dominantHealth}">
          <div>
            <strong>${escapeHtml(c.name)}</strong>
            <div class="campaign-meta">${escapeHtml(quarters)} · 负责人 ${escapeHtml(owners)} · 共 ${c.items.length} 个 SPU</div>
          </div>
          <div class="campaign-counts">
            ${c.red ? `<span class="count-chip red">🔴 ${c.red}</span>` : ""}
            ${c.yellow ? `<span class="count-chip yellow">🟡 ${c.yellow}</span>` : ""}
            ${c.green ? `<span class="count-chip green">🟢 ${c.green}</span>` : ""}
          </div>
        </div>`;
      }).join("") : `<div class="exec-empty">当前筛选下没有主战役数据</div>`;

      const riskHtml = riskItems.length ? riskItems.map(p => `
        <div class="exec-item" data-card-id="${escapeHtml(p.cardId)}">
          <span class="health-dot health-${escapeHtml(p.health)}"></span>
          <div>
            <strong>${escapeHtml(p.productGroup || p.spu)} <span style="color:var(--muted);font-weight:650">· ${escapeHtml(p.tier)} 档 · ${escapeHtml(p.quarter)}</span></strong>
            <span>${escapeHtml(p.main || "未指定战役")} · 负责人 ${escapeHtml(p.owner || "—")}</span>
            ${p.decision ? `<span style="color:#8a242c">⚑ ${escapeHtml(p.decision)}</span>` : ""}
          </div>
        </div>`).join("") : `<div class="exec-empty">当前没有红/黄风险 SPU</div>`;

      const decisionHtml = decisions.length ? decisions.map(p => `
        <div class="exec-item" data-card-id="${escapeHtml(p.cardId)}">
          <span class="health-dot health-${escapeHtml(p.health)}"></span>
          <div>
            <strong>${escapeHtml(p.productGroup || p.spu)} <span style="color:var(--muted);font-weight:650">· ${escapeHtml(p.quarter)}</span></strong>
            <span>${escapeHtml(p.decision)}</span>
            <span style="color:var(--muted)">负责人 ${escapeHtml(p.owner || "—")}</span>
          </div>
        </div>`).join("") : `<div class="exec-empty">暂无待决策事项</div>`;

      roadmap.innerHTML = `<div class="exec-grid" style="padding:14px">
        <section class="exec-card">
          <h2>本季主战役健康度</h2>
          <div class="exec-sub">按战役聚合，按红黄数量排序</div>
          ${campaignHtml}
        </section>
        <section class="exec-card">
          <h2>高风险 SPU</h2>
          <div class="exec-sub">点击进入详情</div>
          ${riskHtml}
        </section>
        <section class="exec-card">
          <h2>需要决策事项</h2>
          <div class="exec-sub">点击进入对应 SPU</div>
          ${decisionHtml}
        </section>
      </div>`;
    }

    function renderGapMatrix(items) {
      const visibleChannels = channels.filter(c => state.channels.has(c));
      const visibleTiers = tiers.filter(t => state.tiers.has(t.id));
      const channelList = visibleChannels.length ? visibleChannels : channels;
      const tierList = visibleTiers.length ? visibleTiers : tiers;

      roadmap.className = "roadmap gap-matrix";
      roadmap.style.gridTemplateColumns = `170px repeat(${tierList.length}, minmax(180px, 1fr))`;

      const headerCells = `<div class="gap-cell head row-head"><strong>渠道</strong><span>档位 × 渠道</span></div>` +
        tierList.map(t => `<div class="gap-cell head"><strong style="color:${t.color}">${escapeHtml(t.id)}</strong><span>${escapeHtml(t.name)}</span></div>`).join("");

      const bodyCells = channelList.map(channel => {
        const rowCells = tierList.map(t => {
          const inCell = items.filter(p => p.tier === t.id && (p.channels || []).includes(channel));
          if (!inCell.length) {
            return `<div class="gap-cell empty-cell">空缺：${escapeHtml(channel)} × ${escapeHtml(t.id)}</div>`;
          }
          const cls = inCell.length === 1 ? "thin-cell" : "";
          const spus = inCell.slice(0, 8).map(p => `<span class="gap-spu" data-card-id="${escapeHtml(p.cardId)}">${escapeHtml(p.productGroup || p.spu)}</span>`).join("");
          const more = inCell.length > 8 ? `<span class="gap-spu">+${inCell.length - 8}</span>` : "";
          return `<div class="gap-cell ${cls}">
            <div class="gap-count">${inCell.length}</div>
            <div class="gap-spus">${spus}${more}</div>
          </div>`;
        }).join("");
        return `<div class="gap-cell row-head"><span class="tag channel-tag" style="--channel-color:${channelColor(channel)}">${escapeHtml(channel)}</span></div>${rowCells}`;
      }).join("");

      roadmap.innerHTML = headerCells + bodyCells;
    }

    function renderMatrix(items) {
      roadmap.className = "roadmap";
      roadmap.style.gridTemplateColumns = "170px repeat(4, minmax(220px, 1fr))";
      roadmap.innerHTML = `<div class="head-cell corner"><strong>品类</strong><span>档位矩阵</span></div>` +
        tiers.map(t => `<div class="head-cell"><strong style="color:${t.color}">${escapeHtml(t.id)}</strong><span>${escapeHtml(t.name)}<br>${escapeHtml(t.desc)}</span></div>`).join("") +
        categories.map(cat => {
          const cells = tiers.map(t => {
            const lane = items.filter(p => p.category === cat.id && p.tier === t.id);
            return `<div class="cell"><div class="lane">${lane.length ? lane.map(card).join("") : `<div class="empty">暂无 SPU</div>`}</div></div>`;
          }).join("");
          return `<div class="row-head">${escapeHtml(cat.name)}<small>${escapeHtml(cat.note)}</small></div>${cells}`;
        }).join("");
    }

    function renderTimeline(items) {
      const quarters = sortedQuarters(unique(items.map(p => p.quarter || "TBD")));
      const columns = Math.max(quarters.length, 1);
      roadmap.className = "roadmap timeline-roadmap";
      roadmap.style.gridTemplateColumns = `170px repeat(${columns}, minmax(240px, 1fr))`;
      roadmap.innerHTML = `<div class="head-cell corner"><strong>品类</strong><span>上市节奏</span></div>` +
        quarters.map(quarter => `<div class="head-cell"><strong>${escapeHtml(quarter)}</strong><span>${quarterSummary(items, quarter)}</span></div>`).join("") +
        categories.map(cat => {
          const cells = quarters.map(quarter => {
            const lane = items.filter(p => p.category === cat.id && (p.quarter || "TBD") === quarter);
            return `<div class="cell"><div class="lane">${lane.length ? lane.map(card).join("") : `<div class="empty">暂无 SPU</div>`}</div></div>`;
          }).join("");
          return `<div class="row-head">${escapeHtml(cat.name)}<small>${escapeHtml(cat.note)}</small></div>${cells}`;
        }).join("");

    function attachProductEvents() {
      roadmap.querySelectorAll(".product-card").forEach(el => {
        const product = products.find(p => p.cardId === el.dataset.cardId);
        if (!product) return;
        el.addEventListener("mouseenter", e => showTooltip(product, e));
        el.addEventListener("mousemove", e => moveTooltip(e));
        el.addEventListener("mouseleave", hideTooltip);
        el.addEventListener("click", e => {
          e.stopPropagation();
          openDrawer(product);
        });
      });
      // Executive / Gap 视图里的可点击条目
      roadmap.querySelectorAll("[data-card-id]:not(.product-card)").forEach(el => {
        const product = products.find(p => p.cardId === el.dataset.cardId);
        if (!product) return;
        el.style.cursor = "pointer";
        el.addEventListener("click", e => {
          e.stopPropagation();
          openDrawer(product);
        });
      });
    }

    function sortedQuarters(values) {
      const list = values.length ? values : ["TBD"];
      return list.sort((a, b) => quarterRank(a) - quarterRank(b) || String(a).localeCompare(String(b)));
    }

    function quarterRank(value) {
      const text = String(value || "TBD").toUpperCase();
      const match = text.match(/(20\d{2})\s*Q([1-4])/);
      if (!match) return 999999;
      return Number(match[1]) * 10 + Number(match[2]);
    }

    function quarterSummary(items, quarter) {
      const inQuarter = items.filter(p => (p.quarter || "TBD") === quarter);
      const configCount = inQuarter.reduce((sum, p) => sum + (p.variantCount || 1), 0);
      const tierMix = tiers.map(t => `${t.id}${inQuarter.filter(p => p.tier === t.id).length}`).filter(item => !item.endsWith("0")).join(" / ");
      return `${configCount} 配置${tierMix ? `<br>${escapeHtml(tierMix)}` : ""}`;
    }

    function card(p) {
      const tier = tiers.find(t => t.id === p.tier) || tiers[1];
      const competitorCount = (p.competitors || []).length;
      const variants = p.variants || [{ spu: p.spu, color: p.color }];
      const cardTitle = p.productGroup || p.spu;
      const configTags = renderCardSkuConfigs(variants, cardTitle);
      const statusStripe = statusStripeForProduct(p.statuses || variants.map(variant => variant.status));
      const competitorTag = competitorCount ? `<span class="tag competitor-tag">竞品 ${competitorCount}</span>` : "";
      const ownerTag = p.owner ? `<span class="tag owner-tag" title="负责人">👤 ${escapeHtml(p.owner)}</span>` : "";
      const decisionTag = p.decision ? `<span class="tag decision-tag" title="${escapeHtml(p.decision)}">⚑ 待决策</span>` : "";
      const staleTag = isStale(p.lastUpdated) ? `<span class="tag stale-tag" title="距上次更新 ${escapeHtml(formatRelative(p.lastUpdated))}">⏱ 待评审</span>` : "";
      const health = p.health || "green";
      return `<article class="product-card" data-card-id="${escapeHtml(p.cardId)}" style="border-left-color:${tier.color}">
        <span class="health-dot health-${escapeHtml(health)} card-health" title="健康度：${escapeHtml(healthLabels[health] || "")}"></span>
        <div class="status-edge" style="--status-stripe:${escapeHtml(statusStripe)}" aria-label="SKU 状态"></div>
        <div class="product-media">
          <img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.spu)}" loading="lazy" />
          <div class="media-meta"><span class="tag quarter">${escapeHtml(p.quarter)}</span></div>
        </div>
        <div>
          <h3>${escapeHtml(cardTitle)}</h3>
          ${configTags}
          <div class="card-meta">
            <div class="meta-line">${p.mapPrice ? `<span class="tag map-tag">MAP ${escapeHtml(p.mapPrice)}</span>` : `<span class="tag map-tag">MAP 待补充</span>`}${competitorTag}${ownerTag}${decisionTag}${staleTag}</div>
            <div class="meta-line">${p.channels.map(channelTag).join("")}</div>
          </div>
        </div>
      </article>`;
    }

    function renderCardSkuConfigs(variants, productName = "") {
      const configs = unique((variants || []).map(variant => {
        const config = String(variant.config || "").trim();
        const color = String(variant.color || "").trim();
        return [config, color].filter(Boolean).join(" · ");
      }).filter(Boolean));
      if (!configs.length) return "";
      return `<div class="sku-configs">${configs.map(config => `<span class="sku-config-tag">${escapeHtml(config)}</span>`).join("")}</div>`;
    }

    function statusStripeForProduct(statuses) {
      const normalized = unique((statuses || []).map(normalizeStatus));
      const colors = normalized.length ? normalized.map(status => statusColors[status] || statusColors.PLAN) : [statusColors.PLAN];
      if (colors.length === 1) return colors[0];
      const step = 100 / colors.length;
      const stops = colors.flatMap((color, index) => [`${color} ${index * step}%`, `${color} ${(index + 1) * step}%`]);
      return `linear-gradient(to bottom, ${stops.join(", ")})`;
    }

    function variantDisplayName(variant, variants = [], productName = "") {
      const config = stripProductTokens(String(variant.config || "").trim(), productName);
      const color = stripProductTokens(String(variant.color || "").trim(), productName, false);
      if ((variants || []).length <= 1 && config) return config;
      if (config && color && !hasConfigToken(config, color)) return `${config} · ${color}`;
      return config || color || "";
    }

    function stripProductTokens(config, productName, keepOriginalIfEmpty = true) {
      if (!config || !productName) return config;
      const productTokens = new Set(String(productName).toLowerCase().split(/[\s_\-·/|,，、;；]+/).filter(token => token.length > 1));
      if (!productTokens.size) return config;
      const configTokens = String(config).split(/[\s_\-·/|,，、;；]+/).filter(Boolean);
      const kept = configTokens.filter(token => !productTokens.has(token.toLowerCase()));
      return kept.length ? kept.join(" ") : (keepOriginalIfEmpty ? config : "");
    }

    function hasConfigToken(config, color) {
      const normalizedColor = String(color || "").trim().toLowerCase();
      if (!normalizedColor) return false;
      return String(config || "").toLowerCase().split(/[\s_\-·/|,，、;；]+/).filter(Boolean).includes(normalizedColor);
    }

    function showTooltip(p, event) {
      tooltip.innerHTML = `<h2>${escapeHtml(p.productGroup || p.spu)}</h2><div class="spu">${escapeHtml(p.category.toUpperCase())} · ${escapeHtml(p.tier)} 档</div>
        ${productHoverHtml(p)}`;
      tooltip.classList.add("show");
      moveTooltip(event);
    }

    function editableSpan(value, field, opts = {}) {
      const { placeholder = "点击编辑", target = "product", index = "", multiline = false, array = "" } = opts;
      const text = String(value ?? "").trim();
      // viewer 模式：直接展示纯文本（无可编辑感、无 data-* 属性）
      if (!isAdmin()) {
        const display = text || (multiline ? "" : "");
        const cls = multiline ? "value-multiline" : "";
        return `<span class="${cls}" style="white-space:${multiline ? "pre-wrap" : "normal"}">${escapeHtml(display) || `<span style="color:#aab1a8">—</span>`}</span>`;
      }
      const cls = ["editable"];
      if (!text) cls.push("is-empty");
      if (multiline) cls.push("is-multiline");
      return `<span class="${cls.join(" ")}" data-edit-target="${target}" data-edit-field="${field}"${index !== "" ? ` data-edit-index="${index}"` : ""}${array ? ` data-edit-array="${array}"` : ""} data-placeholder="${escapeHtml(placeholder)}">${escapeHtml(text || placeholder)}</span>`;
    }

    function editableSelect(value, field, options, opts = {}) {
      const { target = "product", index = "" } = opts;
      const matched = options.find(opt => opt.id === value);
      // viewer 模式：纯文本
      if (!isAdmin()) {
        return `<span>${escapeHtml(matched ? matched.label : value)}</span>`;
      }
      const optsHtml = options.map(opt => `<option value="${escapeHtml(opt.id)}"${opt.id === value ? " selected" : ""}>${escapeHtml(opt.label)}</option>`).join("");
      return `<select class="editable-select" data-edit-target="${target}" data-edit-field="${field}" data-edit-type="select"${index !== "" ? ` data-edit-index="${index}"` : ""}>${optsHtml}</select>`;
    }

    function openDrawer(p) {
      hideTooltip();
      const tier = tiers.find(t => t.id === p.tier) || tiers[1];
      const health = p.health || "green";
      state.openedSpu = p.productGroup || p.spu;
      syncRouteToHash();
      detailDrawer.innerHTML = `<div class="drawer-head">
          <div>
            <h2>${editableSpan(p.productGroup || p.spu, "productGroup", { placeholder: "产品组名" })}</h2>
            <div class="spu">${escapeHtml(p.category.toUpperCase())} · <span style="color:${tier.color}">${escapeHtml(p.tier)} 档</span></div>
          </div>
          <button class="icon-btn" type="button" aria-label="关闭详情" id="closeDrawerBtn">×</button>
        </div>
        <div class="drawer-hero">
          <img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.spu)}" />
          <div class="meta-line">
            <span class="health-pill"><span class="health-dot health-${escapeHtml(health)}"></span>${editableSelect(health, "health", healthDefinitions.map(h => ({ id: h.id, label: h.label })))}</span>
            <span class="tag quarter">季度 ${editableSpan(p.quarter, "quarter", { placeholder: "如 2026 Q3" })}</span>
            <span class="tag map-tag">MAP ${editableSpan(p.mapPrice, "mapPrice", { placeholder: "$0" })}</span>
          </div>
          <div class="meta-line">${p.channels.map(channelTag).join("")}</div>
        </div>
        <div class="drawer-edit-hint admin-only">点击任意字段即可编辑（Enter 保存 / Esc 取消），数组字段用 “/” 或 “,” 分隔。改动会即时写入内存——确认无误后点 <strong>导出 Excel</strong> 持久化。</div>
        ${productDetailHtml(p)}`;
      detailDrawer.classList.add("show");
      drawerBackdrop.classList.add("show");
      detailDrawer.setAttribute("aria-hidden", "false");
      document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
      bindDrawerEditing(p);

    function bindDrawerEditing(product) {
      if (!isAdmin()) return;  // viewer 模式：不附加编辑事件
      detailDrawer.querySelectorAll(".editable").forEach(el => {
        el.addEventListener("click", () => beginEdit(el, product));
      });
      detailDrawer.querySelectorAll(".editable-select").forEach(el => {
        el.addEventListener("change", () => applySelectEdit(el, product));
      });
    }

    function beginEdit(el, product) {
      if (el.classList.contains("is-editing")) return;
      const multiline = el.classList.contains("is-multiline");
      const placeholder = el.dataset.placeholder || "";
      const current = el.classList.contains("is-empty") ? "" : (multiline ? el.innerText : el.textContent);
      el.classList.remove("is-empty");
      el.classList.add("is-editing");
      el.setAttribute("contenteditable", "true");
      if (multiline) el.innerText = current; else el.textContent = current;
      // 全选
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el.focus();
      const finalize = (commit) => {
        el.removeEventListener("blur", onBlur);
        el.removeEventListener("keydown", onKey);
        el.setAttribute("contenteditable", "false");
        el.classList.remove("is-editing");
        if (commit) {
          const newValue = (multiline ? el.innerText : el.textContent).trim();
          applyTextEdit(el, product, newValue);
        } else {
          if (multiline) el.innerText = current || placeholder; else el.textContent = current || placeholder;
          if (!current) el.classList.add("is-empty");
        }
      };
      const onBlur = () => finalize(true);
      const onKey = (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          el.blur();
        } else if (event.key === "Escape") {
          event.preventDefault();
          finalize(false);
        }
      };
      el.addEventListener("blur", onBlur);
      el.addEventListener("keydown", onKey);
    }

    function applyTextEdit(el, product, newValue) {
      const target = el.dataset.editTarget;
      const field = el.dataset.editField;
      const array = el.dataset.editArray;
      const indexAttr = el.dataset.editIndex;
      const idx = indexAttr !== undefined ? Number(indexAttr) : -1;
      let reason = field;
      if (target === "product") {
        if (field === "quarter") product.quarter = newValue || "TBD";
        else if (field === "mapPrice") product.mapPrice = newValue;
        else if (field === "channels") {
          const arr = normalizeChannels(splitList(newValue));
          product.channels = arr.length ? arr : ["TBD"];
        } else if (field === "owner") product.owner = newValue;
        else if (field === "decision") product.decision = newValue;
        else if (field === "platform") product.platform = newValue;
        else if (field === "dependencies") product.dependencies = splitList(newValue);
        else if (field === "productGroup") {
          product.productGroup = newValue;
          product.spu = newValue || product.spu;
        } else {
          product[field] = newValue;
        }
      } else if (target === "variant" && idx >= 0 && product.variants[idx]) {
        const variant = product.variants[idx];
        if (field === "channels") {
          const arr = normalizeChannels(splitList(newValue));
          variant.channels = arr.length ? arr : ["TBD"];
          product.channels = mergeChannels([], product.variants.flatMap(v => v.channels || []));
        } else {
          variant[field] = newValue;
        }
        reason = `${field} (${variant.config || variant.spu || `SKU ${idx + 1}`})`;
      } else if (target === "competitor" && idx >= 0 && product.competitors && product.competitors[idx]) {
        product.competitors[idx][field] = newValue;
        reason = `竞品 ${product.competitors[idx].name || idx + 1} · ${field}`;
      }
      // 任何编辑都刷新 lastUpdated
      product.lastUpdated = new Date().toISOString();
      product.statuses = unique((product.variants || []).map(v => normalizeStatus(v.status)));
      render();
      const fresh = products.find(item => item.cardId === product.cardId) || product;
      openDrawer(fresh);
      markDirty(reason);
    }

    function applySelectEdit(el, product) {
      const target = el.dataset.editTarget;
      const field = el.dataset.editField;
      const indexAttr = el.dataset.editIndex;
      const idx = indexAttr !== undefined ? Number(indexAttr) : -1;
      const value = el.value;
      if (target === "product") {
        product[field] = value;
      } else if (target === "variant" && idx >= 0 && product.variants[idx]) {
        product.variants[idx][field] = value;
      }
      product.lastUpdated = new Date().toISOString();
      product.statuses = unique((product.variants || []).map(v => normalizeStatus(v.status)));
      render();
      const fresh = products.find(item => item.cardId === product.cardId) || product;
      openDrawer(fresh);
      markDirty(field);
    }

    function closeDrawer() {
      detailDrawer.classList.remove("show");
      drawerBackdrop.classList.remove("show");
      detailDrawer.setAttribute("aria-hidden", "true");
      state.openedSpu = null;
      syncRouteToHash();
    }

    function productHoverHtml(p) {
      const variants = p.variants || [{ spu: p.spu, color: p.color }];
      const competitors = renderCompetitors(p.competitors || []);
      return `<div class="detail">
        <div class="detail-row"><b>SKU定位</b><span>${renderHoverSkuItems(variants)}</span></div>
        <div class="detail-row"><b>战略定位</b><span>${escapeHtml(p.position)}</span></div>
        <div class="detail-row"><b>核心职责</b><span>${escapeHtml(p.role)}</span></div>
        <div class="detail-row"><b>对应竞品</b><span>${competitors}</span></div>
      </div>`;
    }

    function renderHoverSkuItems(variants) {
      if (!variants.length) return "待补充";
      return `<div class="variant-list">${variants.map(variant => {
        const config = [variant.config, variant.color].map(value => String(value || "").trim()).filter(Boolean).join(" · ") || variant.sku || variant.spu || "默认配置";
        const channelText = variant.channels && variant.channels.length ? variant.channels.join(" / ") : "待补充";
        return `<div class="variant-item">
          <img src="${escapeHtml(variant.img || placeholderImage("cam"))}" alt="${escapeHtml(variant.spu)}" loading="lazy" />
          <div class="variant-copy">
            <strong>${escapeHtml(config)}</strong>
            <span><b>状态：</b>${escapeHtml(normalizeStatus(variant.status))}</span>
            <span><b>MAP / 渠道：</b>${escapeHtml(variant.mapPrice || "待补充")} · ${escapeHtml(channelText)}</span>
            <span><b>定位差异：</b>${escapeHtml(variant.position || "待补充")}</span>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function productDetailHtml(p) {
      const competitors = renderCompetitorsEditable(p.competitors || []);
      const variants = p.variants || [{ spu: p.spu, color: p.color }];
      const skuConfigs = renderVariantsEditable(variants, p.productGroup || p.spu);
      const channelsText = (p.channels || []).join(" / ");
      const depsText = (p.dependencies || []).join(" / ");
      const stale = isStale(p.lastUpdated);
      const updatedText = `${escapeHtml(formatRelative(p.lastUpdated))}${p.lastUpdated ? `（${escapeHtml(formatDateShort(p.lastUpdated))}）` : ""}${stale ? `<span class="tag stale-tag" style="margin-left:6px">⏱ 待评审</span>` : ""}`;
      return `<div class="detail">
        <div class="detail-row"><b>负责人</b><span>${editableSpan(p.owner, "owner", { placeholder: "填写 PM/负责人" })}</span></div>
        <div class="detail-row"><b>需要决策</b><span>${editableSpan(p.decision, "decision", { placeholder: "若需上层决策，写一句话；留空则不出现在执行摘要" })}</span></div>
        <div class="detail-row"><b>渠道</b><span>${editableSpan(channelsText, "channels", { placeholder: "SC / WM / SHOPIFY", array: "csv" })}</span></div>
        <div class="detail-row"><b>主战役</b><span>${editableSpan(p.main, "main", { placeholder: "主战役" })}</span></div>
        <div class="detail-row"><b>次战役</b><span>${editableSpan(p.secondary, "secondary", { placeholder: "次战役" })}</span></div>
        <div class="detail-row"><b>战略定位</b><span>${editableSpan(p.position, "position", { placeholder: "战略定位" })}</span></div>
        <div class="detail-row"><b>核心职责</b><span>${editableSpan(p.role, "role", { placeholder: "核心职责" })}</span></div>
        <div class="detail-row"><b>平台模组</b><span>${editableSpan(p.platform, "platform", { placeholder: "如：鲜食保鲜模组 v1" })}</span></div>
        <div class="detail-row"><b>依赖 SPU</b><span>${editableSpan(depsText, "dependencies", { placeholder: "用 / 分隔，如 FDR-C300 / HFD-P500", array: "csv" })}</span></div>
        <div class="detail-row"><b>最近更新</b><span class="updated-meta">${updatedText}</span></div>
        <div class="detail-row"><b>SKU配置</b><span>${skuConfigs}</span></div>
        <div class="detail-row"><b>对应竞品</b><span>${competitors}</span></div>
      </div>`;
    }

    function renderVariantsEditable(variants, productName = "") {
      if (!variants.length) {
        return `<div class="sku-empty">当前产品还没有 SKU 配置。请在 Excel 模板里补充 SKU配置/SKU定位差异/SKU渠道/SKU MAP价格。</div>`;
      }
      return `<div class="variant-list">${variants.map((variant, idx) => {
        const channelText = (variant.channels || []).join(" / ");
        const statusSelect = editableSelect(normalizeStatus(variant.status), "status", statusDefinitions.map(s => ({ id: s.id, label: `${s.id} · ${s.label}` })), { target: "variant", index: idx });
        return `<div class="variant-item">
          <img src="${escapeHtml(variant.img || placeholderImage("cam"))}" alt="${escapeHtml(variant.spu)}" loading="lazy" />
          <div class="variant-copy">
            <strong>${editableSpan(variant.config || variant.color || "默认配置", "config", { target: "variant", index: idx, placeholder: "SKU 配置" })}</strong>
            <span><b>状态：</b>${statusSelect}</span>
            <span><b>MAP：</b>${editableSpan(variant.mapPrice, "mapPrice", { target: "variant", index: idx, placeholder: "$0" })}</span>
            <span><b>渠道：</b>${editableSpan(channelText, "channels", { target: "variant", index: idx, placeholder: "SC / WM", array: "csv" })}</span>
            <span><b>主战役：</b>${editableSpan(variant.main, "main", { target: "variant", index: idx, placeholder: "主战役" })}</span>
            <span><b>次战役：</b>${editableSpan(variant.secondary, "secondary", { target: "variant", index: idx, placeholder: "次战役" })}</span>
            <span><b>定位差异：</b>${editableSpan(variant.position, "position", { target: "variant", index: idx, placeholder: "差异化卖点" })}</span>
            <div class="variant-notes"><b>备注：</b>${editableSpan(variant.notes, "notes", { target: "variant", index: idx, placeholder: "多行备注：风险、待办、改版思路…（Shift+Enter 换行 / Enter 保存）", multiline: true })}</div>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function renderCompetitorsEditable(competitors) {
      if (!competitors.length) return `<span style="color:#aab1a8">${isAdmin() ? "（暂无竞品，请在 Excel 模板里录入后导入）" : "—"}</span>`;
      return `<div class="competitor-list">${competitors.map((c, idx) => `
        <div class="competitor-item">
          <img src="${escapeHtml(c.img || placeholderImage("cam"))}" alt="${escapeHtml(c.name)}" loading="lazy" />
          <div class="competitor-copy">
            <strong>${editableSpan(c.name, "name", { target: "competitor", index: idx, placeholder: "竞品名" })}</strong>
            <span>公司：${editableSpan(c.company, "company", { target: "competitor", index: idx, placeholder: "竞品公司" })}</span>
            <span>价格：${editableSpan(c.price, "price", { target: "competitor", index: idx, placeholder: "价格区间" })}</span>
            <span>渠道：${editableSpan(c.channel, "channel", { target: "competitor", index: idx, placeholder: "渠道" })}</span>
            <span>对比：${editableSpan(c.point, "point", { target: "competitor", index: idx, placeholder: "竞品优势" })}</span>
            <span>打法：${editableSpan(c.response, "response", { target: "competitor", index: idx, placeholder: "我方打法" })}</span>
          </div>
        </div>`).join("")}</div>`;
    }

    function renderVariants(variants, productName = "") {
      const hasSkuDetail = variants.some(variant => variant.config || variant.color || variant.position || (variant.sku && variant.sku !== variant.spu));
      if (!hasSkuDetail) {
        return `<div class="sku-empty">当前产品还没有导入 SKU 配置差异。请在模板里填写 SKU配置、SKU定位差异、SKU渠道、SKU MAP价格。</div>`;
      }
      return `<div class="variant-list">${variants.map(variant => {
        const config = variantDisplayName(variant, variants, productName) || variant.sku || variant.spu || "默认配置";
        const channelText = variant.channels && variant.channels.length ? variant.channels.join(" / ") : "待补充";
        return `<div class="variant-item">
          <img src="${escapeHtml(variant.img || placeholderImage("cam"))}" alt="${escapeHtml(variant.spu)}" loading="lazy" />
          <div class="variant-copy">
            <strong>${escapeHtml(config)}</strong>
            <span><b>状态：</b>${escapeHtml(normalizeStatus(variant.status))}</span>
            <span><b>MAP / 渠道：</b>${escapeHtml(variant.mapPrice || "待补充")} · ${escapeHtml(channelText)}</span>
            <span><b>主战役：</b>${escapeHtml(variant.main || "待定义")}</span>
            <span><b>次战役：</b>${escapeHtml(variant.secondary || "待定义")}</span>
            <span><b>定位差异：</b>${escapeHtml(variant.position || "待补充")}</span>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function renderCompetitors(competitors) {
      if (!competitors.length) return "待补充";
      return `<div class="competitor-list">${competitors.map(c => `
        <div class="competitor-item">
          <img src="${escapeHtml(c.img || placeholderImage("cam"))}" alt="${escapeHtml(c.name)}" loading="lazy" />
          <div class="competitor-copy">
            <strong>${escapeHtml(c.name)}</strong>
            ${c.company ? `<span>公司：${escapeHtml(c.company)}</span>` : ""}
            ${c.price ? `<span>价格：${escapeHtml(c.price)}</span>` : ""}
            ${c.channel ? `<span>渠道：${escapeHtml(c.channel)}</span>` : ""}
            ${c.point ? `<span>对比：${escapeHtml(c.point)}</span>` : ""}
            ${c.response ? `<span>打法：${escapeHtml(c.response)}</span>` : ""}
          </div>
        </div>`).join("")}</div>`;
    }

    function moveTooltip(event) {
      const pad = 14;
      const rect = tooltip.getBoundingClientRect();
      let x = event.clientX + 16;
      let y = event.clientY + 16;
      if (x + rect.width + pad > window.innerWidth) x = event.clientX - rect.width - 16;
      if (y + rect.height + pad > window.innerHeight) y = window.innerHeight - rect.height - pad;
      tooltip.style.left = `${Math.max(pad, x)}px`;
      tooltip.style.top = `${Math.max(pad, y)}px`;
    }

    function hideTooltip() { tooltip.classList.remove("show"); }

    // 启动：先确定角色（影响 drawer 渲染），再同步维度
    setRole(getRole());
    // 烘焙数据可能带额外品类/渠道，把侧栏过滤器跟上
    syncDimensionsFromProducts();
    initControls();
    render();
    applyHashToState();

    // 异步从 Cloudflare Worker 拉云端最新数据；拿不到就保留 BAKED_ROWS
    if (syncEnabled()) {
      updateSyncStatus("loading");
      loadFromCloud().then(cloudRows => {
        if (cloudRows && Array.isArray(cloudRows) && cloudRows.length) {
          products = groupProductVariants(cloudRows);
          syncDimensionsFromProducts();
          renderChannelFilters();
          renderStatusFilters();
          render();
          // 如果当前打开了某个 drawer，用新数据刷新一下
          if (detailDrawer.classList.contains("show") && state.openedSpu) {
            const fresh = products.find(p => (p.productGroup || p.spu || "").toLowerCase() === String(state.openedSpu).toLowerCase());
            if (fresh) openDrawer(fresh);
          }
        }
      });
      // 每 60 秒刷新一下相对时间显示（不重新 fetch）
      setInterval(() => {
        const el = document.getElementById("syncStatus");
        if (el && el.dataset.state === "synced" && lastSyncedAt) updateSyncStatus("synced");
      }, 60000);
    } else {
      updateSyncStatus(isAdmin() ? "local" : "viewer");
    }

    window.addEventListener("hashchange", () => {
      if (suppressHashSync) return;
      applyHashToState();
    });
    window.addEventListener("beforeunload", e => {
      if (dirty) {
        e.preventDefault();
        e.returnValue = "你有未导出的改动，离开会丢失。";
        return e.returnValue;
      }
    });
  </script>
</body>
</html>
